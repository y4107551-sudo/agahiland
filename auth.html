<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ورود با موبایل | آگهی‌لند</title>
<style>
body {
  font-family: Tahoma, sans-serif;
  background: #f2f5f3;
  padding: 20px;
}
.box {
  max-width: 400px;
  margin: 50px auto;
  background: white;
  padding: 25px;
  border-radius: 15px;
  text-align: center;
}
h2 { color: #16854b; }
input, button {
  box-sizing: border-box;
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  border-radius: 9px;
  font-size: 16px;
}
input { border: 1px solid #ccc; }
button {
  background: #16854b;
  color: white;
  border: none;
}
#codeBox { display: none; }
#message { color: #b45309; }
</style>
</head>
<body>

<div class="box">
<h2>🌿 آگهی‌لند</h2>
<p>ورود با شماره موبایل</p>

<div id="phoneBox">
<input id="phone" type="tel"
placeholder="شماره موبایل: 09130000000">
<button onclick="sendCode()">دریافت کد تأیید</button>
</div>

<div id="codeBox">
<p>کد آزمایشی: 123456</p>
<input id="code" type="text"
placeholder="کد تأیید ۶ رقمی">
<button onclick="verifyCode()">تأیید کد</button>
</div>

<p id="message"></p>
<a href="index.html">بازگشت به صفحه اصلی</a>
</div>

<script>
function sendCode() {
  const phone = document.getElementById("phone").value.trim();

  if (!/^09\d{9}$/.test(phone)) {
    alert("شماره موبایل معتبر وارد کن");
    return;
  }

  document.getElementById("phoneBox").style.display = "none";
  document.getElementById("codeBox").style.display = "block";
  document.getElementById("message").textContent =
    "حالت آزمایشی است؛ پیامک واقعی ارسال نمی‌شود.";
}

function verifyCode() {
  const code = document.getElementById("code").value.trim();

  if (code === "123456") {
    document.getElementById("message").textContent =
      "کد آزمایشی پذیرفته شد. این ورود واقعی نیست.";
  } else {
    alert("کد اشتباه است");
  }
}
</script>

</body>
</html>
