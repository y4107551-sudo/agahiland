<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <link rel="icon" type="image/png" href="agahiland-icon.png">
<link rel="apple-touch-icon" href="agahiland-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>آگهی‌لند | خرید و فروش آسان</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial;background:#f5f7f5;color:#222}
header{background:#16854b;color:white;padding:22px;text-align:center}
header h1{margin:0;font-size:30px}
header p{margin:10px 0 0}
nav{background:white;padding:15px;display:flex;justify-content:space-around;box-shadow:0 2px 8px #ddd}
nav a{color:#16854b;text-decoration:none;font-weight:bold}
main{padding:20px;max-width:1100px;margin:auto}
.search{width:100%;padding:16px;border:1px solid #ddd;border-radius:12px;font-size:16px}
.categories{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:25px 0}
.category{background:white;padding:22px;text-align:center;border-radius:15px;box-shadow:0 3px 12px #ddd}
.category span{font-size:32px;display:block;margin-bottom:10px}
h2{font-size:22px}
.ads{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px}
.ad{background:white;border-radius:15px;overflow:hidden;box-shadow:0 3px 12px #ddd}
.ad img{width:100%;height:180px;object-fit:cover}
.ad-content{padding:15px}
.price{color:#16854b;font-weight:bold}
.add-btn{position:fixed;bottom:20px;left:20px;background:#16854b;color:white;padding:16px 25px;border-radius:40px;text-decoration:none;box-shadow:0 5px 20px #999}
footer{text-align:center;padding:35px;color:#777}
</style>
</head>
<body>

<header>
<h1>🛒 آگهی‌لند</h1>
<p>هرچی داری بفروش، هرچی می‌خوای پیدا کن!</p>
</header>

<nav>
<a href="#">خانه</a>
<a href="#categories">دسته‌بندی‌ها</a>
<a href="#ads">آگهی‌ها</a>
  <a href="sandoogh.html">🗑️ سطل زباله</a>
</nav>

<main>
<input class="search" id="searchInput" placeholder="🔍 دنبال چی می‌گردی؟" oninput="searchAds()">

<h2 id="categories">دسته‌بندی‌ها</h2>
<div class="categories">
<div class="category"><span>🚗</span>خودرو</div>
<div class="category"><span>🏠</span>املاک</div>
<div class="category"><span>📱</span>موبایل</div>
<div class="category"><span>🛋️</span>لوازم خانه</div>
</div>

<h2 id="ads">تازه‌ترین آگهی‌ها</h2>
<div class="ads">
<div class="ad">
<div class="ad-content">
<h3>پژو پارس مدل ۱۳۹۹</h3>
<p class="price">۵۸۰ میلیون تومان</p>
<p>📍 یزد</p>
</div>
</div>
<div class="ad">
<div class="ad-content">
<h3>گوشی سامسونگ A54</h3>
<p class="price">۱۵ میلیون تومان</p>
<p>📍 یزد</p>
</div>
</div>
</div>
</main>

<a class="add-btn" href="sabt.html">➕ ثبت آگهی</a>

<footer>© 2026 آگهی‌لند</footer>
  <script>
(function () {
  const container = document.querySelector(".ads");
  if (!container) return;

  let ads = [];
  try {
    ads = JSON.parse(localStorage.getItem("agahiland_ads") || "[]");
  } catch (e) {
    return;
  }
const thirtyDays = 30 * 24 * 60 * 60 * 1000;
const now = Date.now();

let trash = [];

try {
  trash = JSON.parse(
    localStorage.getItem("agahiland_trash") || "[]"
  );
} catch (e) {
  trash = [];
}

const activeAds = [];
const newTrash = [];

ads.forEach(function(ad) {
  const created = Number(ad.createdAt || ad.id);

  if (Number.isFinite(created) &&
      created > 0 &&
      now - created >= thirtyDays) {
    ad.deletedAt = now;
    newTrash.push(ad);
  } else {
    activeAds.push(ad);
  }
});

trash = trash.filter(function(ad) {
  const deleted = Number(ad.deletedAt || now);
  return now - deleted < thirtyDays;
});

trash = trash.concat(newTrash);

localStorage.setItem("agahiland_ads", JSON.stringify(activeAds));
localStorage.setItem("agahiland_trash", JSON.stringify(trash));

ads = activeAds;
  ads.forEach(function (ad) {
    const card = document.createElement("div");
    card.className = "ad";

    if (ad.photo) {
      const img = document.createElement("img");
      img.src = ad.photo;
      img.alt = ad.title || "عکس آگهی";
      card.appendChild(img);
    }

    const content = document.createElement("div");
    content.className = "ad-content";

    const title = document.createElement("h3");
    title.textContent = ad.title || "";

    const price = document.createElement("p");
    price.className = "price";
    price.textContent = ad.price
      ? Number(ad.price).toLocaleString("fa-IR") + " تومان"
      : "توافقی";

    const city = document.createElement("p");
    city.textContent = "📍 " + (ad.city || "");

    content.append(title, price, city);

    if (ad.description) {
      const desc = document.createElement("p");
      desc.textContent = ad.description;
      content.appendChild(desc);
    }

    card.appendChild(content);
    const deleteButton = document.createElement("button");
deleteButton.textContent = "🗑️ حذف آگهی";
deleteButton.style.cssText =
  "background:red;color:white;padding:10px;border:0;border-radius:8px;margin:10px;";

deleteButton.onclick = function() {
  if (!confirm("آگهی به سطل زباله منتقل شود؟")) return;

  let currentAds = JSON.parse(
    localStorage.getItem("agahiland_ads") || "[]"
  );

  let trash = JSON.parse(
    localStorage.getItem("agahiland_trash") || "[]"
  );

  const index = currentAds.findIndex(function(item) {
    return String(item.id) === String(ad.id);
  });

  if (index === -1) return;

  const removedAd = currentAds.splice(index, 1)[0];
  removedAd.deletedAt = Date.now();
  trash.push(removedAd);

  localStorage.setItem("agahiland_ads", JSON.stringify(currentAds));
  localStorage.setItem("agahiland_trash", JSON.stringify(trash));

  card.remove();
  alert("آگهی به سطل زباله منتقل شد");
};

card.appendChild(deleteButton);
    container.prepend(card);
  });
})();
  </script>
  <script>
function searchAds() {
  const input = document.getElementById("searchInput");
  const cards = document.querySelectorAll(".ads .ad");
  const query = input.value.trim().toLowerCase();

  cards.forEach(function(card) {
    const text = card.textContent.toLowerCase();
    card.style.display = text.includes(query) ? "" : "none";
  });
}
  </script>
</body>
</html>
